<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b13"><title>My Account | Royal Snack House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.account-page{min-height:100vh;background:var(--cream)}.account-main{max-width:850px;margin:70px auto;padding:0 22px}.account-card{background:#fffdf8;border:1px solid #e5ddce;padding:36px;box-shadow:0 18px 50px #17251d10}.account-card h1{font:600 38px var(--serif);color:var(--forest);margin:8px 0}.account-card p{color:var(--muted);font-size:13px;line-height:1.8}.account-detail{margin:25px 0;padding:18px;background:#f5efe3;border-left:3px solid var(--gold)}.account-detail small{display:block;color:#987239;letter-spacing:1.5px;text-transform:uppercase;font-size:9px}.account-detail b{display:block;margin-top:6px;overflow-wrap:anywhere}.account-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.account-actions a,.account-actions button{border:0;padding:13px 18px;background:var(--forest);color:var(--gold-light);font-size:10px;text-decoration:none;cursor:pointer}.account-actions button{background:#e9e0d0;color:var(--forest)}#accountStatus{font-size:12px;color:#a12b2b}@media(max-width:600px){.account-main{margin:35px auto}.account-card{padding:25px 20px}.account-card h1{font-size:30px}}
</style></head><body class="account-page"><div class="announcement">ROYAL SNACK HOUSE <span>✦</span> YOUR ACCOUNT</div><header class="site-header"><nav class="nav shell"><a class="brand" href="index.html"><img src="assets/royal-snack-house-logo.svg" alt="Royal Snack House"><span><b>ROYAL SNACK HOUSE</b><small>THE ART OF SNACKING</small></span></a><div class="nav-tools"><a class="nav-btn" href="index.html">Shop snacks</a></div></nav></header><main class="account-main"><section class="account-card"><span class="eyebrow dark">MEMBER ACCOUNT</span><h1>Welcome to your account.</h1><p>Manage your Royal Snack House sign-in and continue exploring our snack collection.</p><div class="account-detail"><small>Signed in as</small><b id="accountEmail">Loading…</b></div><div class="account-detail"><small>Account name</small><b id="accountName">—</b></div><p id="accountStatus" role="status"></p><form id="recoveryForm" hidden style="margin-top:22px;display:none;gap:12px"><h2 style="font:600 24px var(--serif);color:var(--forest)">Set a new password</h2><label style="display:grid;gap:7px;font-size:11px">New password<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required style="padding:13px;border:1px solid #d9cfbc;background:#fff"></label><button class="gold-button" type="submit">Update password ↗</button></form><div class="account-actions"><a href="index.html#shop">Browse snacks ↗</a><button id="accountSignOut" type="button">Sign out</button></div></section></main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
const supabase=createClient("https://ubwdtuggqftzzdkdlzpj.supabase.co","sb_publishable_LtOda0MxMFrN_laGRH67LA_FcQn6v7h");
const status=document.getElementById("accountStatus");
const recoveryForm=document.getElementById("recoveryForm");
const {data:{session}}=await supabase.auth.getSession();
if(!session){location.replace("index.html");}
else{document.getElementById("accountEmail").textContent=session.user.email||"—";document.getElementById("accountName").textContent=session.user.user_metadata?.full_name||session.user.user_metadata?.display_name||"Royal Snack House customer";}
const revealRecovery=()=>{recoveryForm.hidden=false;recoveryForm.style.display="grid";status.textContent="Choose a new password for your account.";};
if(location.hash.includes("type=recovery"))revealRecovery();
supabase.auth.onAuthStateChange(event=>{if(event==="PASSWORD_RECOVERY")revealRecovery();});
recoveryForm.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("newPassword").value;if(password.length<8){status.textContent="Use at least 8 characters.";return;}const {error}=await supabase.auth.updateUser({password});if(error){status.textContent=error.message;return;}status.textContent="Password updated successfully. You can now sign in with your new password.";recoveryForm.style.display="none";});
document.getElementById("accountSignOut").addEventListener("click",async()=>{const {error}=await supabase.auth.signOut();if(error){status.textContent=error.message;return;}location.href="index.html";});
</script></body></html>
