<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSH Growth Desk</title><link rel="stylesheet" href="style.css"><style>body{background:#f5f2e9;color:#193326;font-family:Arial,sans-serif}.desk{max-width:1100px;margin:35px auto;padding:20px}.panel{background:#fff;padding:22px;margin:18px 0;border:1px solid #e4dccb}.panel h2{font-family:Georgia}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eee}.row form{display:flex;gap:8px;flex:1}.row input,.panel input,.panel textarea,.panel select{padding:10px;border:1px solid #ddd;min-width:0}.panel button{background:#173b2a;color:#f3d99d;padding:10px;border:0;cursor:pointer}.muted{color:#777;font-size:12px}#desk{display:none}</style></head><body><main class="desk"><h1>ROYAL SNACK HOUSE · GROWTH DESK</h1><p class="muted">Staff-only inbox, abandoned carts and festival campaigns.</p><section id="login" class="panel"><h2>Staff sign in</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="signIn">Sign in</button><p id="status"></p></section><div id="desk"><section class="panel"><h2>Live customer support</h2><div id="inbox"></div></section><section class="panel"><h2>Abandoned carts</h2><p class="muted">Recovery links are customer-specific; send only to the matching customer using your approved contact channel.</p><div id="carts"></div></section><section class="panel"><h2>Festival Store campaigns</h2><form id="festivalForm"><input name="title" required placeholder="Festival title"><input name="subtitle" placeholder="Subtitle"><input name="banner_text" placeholder="Banner message"><label>Starts <input name="starts_at" type="datetime-local"></label><label>Ends <input name="ends_at" type="datetime-local"></label><label><input name="is_active" type="checkbox"> Publish campaign</label><button>Save campaign</button></form><div id="campaigns"></div></section></div></main><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.57.0";
const URL="https://ubwdtuggqftzzdkdlzpj.supabase.co",KEY="sb_publishable_LtOda0MxMFrN_laGRH67LA_FcQn6v7h",db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let staff;
async function enter(){const{data}=await db.auth.getSession();if(!data.session)return;const{data:p,error}=await db.from("admin_profiles").select("user_id,role,is_active").eq("user_id",data.session.user.id).maybeSingle();if(error||!p?.is_active){$("status").textContent="This account does not have active staff access.";return;}staff=data.session.user;$("login").style.display="none";$("desk").style.display="block";await Promise.all([loadInbox(),loadCarts(),loadCampaigns()]);}
$("signIn").onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("status").textContent=error.message;return;}await enter();};
async function loadInbox(){const{data,error}=await db.from("support_conversations").select("*").order("updated_at",{ascending:false});if(error){$("inbox").textContent=error.message;return;}$("inbox").innerHTML=(data||[]).map(x=>'<article class="row"><div><b>'+esc(x.subject)+'</b><p class="muted">'+esc(x.status)+' · '+x.id+'</p><div id="msg-'+x.id+'"></div></div><form data-thread="'+x.id+'"><input name="message" required maxlength="2000" placeholder="Reply to customer"><button>Send</button></form><select data-status="'+x.id+'"><option>open</option><option>waiting</option><option>resolved</option></select></article>').join("")||"No support requests.";for(const x of data||[]){const{data:m}=await db.from("support_messages").select("message,is_staff,created_at").eq("conversation_id",x.id).order("created_at");$("msg-"+x.id).innerHTML=(m||[]).map(z=>'<p class="muted"><b>'+(z.is_staff?"Staff":"Customer")+':</b> '+esc(z.message)+'</p>').join("");}document.querySelectorAll("[data-thread]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const msg=new FormData(f).get("message");const{error}=await db.from("support_messages").insert({conversation_id:f.dataset.thread,sender_id:staff.id,message:msg,is_staff:true});if(error)alert(error.message);else{await db.from("support_conversations").update({status:"waiting",updated_at:new Date().toISOString()}).eq("id",f.dataset.thread);loadInbox();}});document.querySelectorAll("[data-status]").forEach(s=>s.onchange=async()=>{await db.from("support_conversations").update({status:s.value,updated_at:new Date().toISOString()}).eq("id",s.dataset.status);});}
async function loadCarts(){const{data,error}=await db.from("abandoned_carts").select("user_id,cart_items,recovery_token,updated_at,recovered_at").is("recovered_at",null).order("updated_at",{ascending:false}).limit(50);if(error){$("carts").textContent=error.message;return;}$("carts").innerHTML=(data||[]).map(x=>'<div class="row"><div><b>'+x.user_id+'</b><p class="muted">'+(x.cart_items||[]).length+' product lines · '+new Date(x.updated_at).toLocaleString()+'</p></div><button data-copy="'+location.origin+'/index.html?recover='+encodeURIComponent(x.recovery_token)+'">Copy recovery link</button></div>').join("")||"No abandoned carts.";document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy));}
$("festivalForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),row={title:f.get("title"),subtitle:f.get("subtitle"),banner_text:f.get("banner_text"),starts_at:f.get("starts_at")?new Date(f.get("starts_at")).toISOString():null,ends_at:f.get("ends_at")?new Date(f.get("ends_at")).toISOString():null,is_active:f.get("is_active")==="on"};const{error}=await db.from("festival_campaigns").insert(row);if(error)alert(error.message);else{e.currentTarget.reset();loadCampaigns();}};
async function loadCampaigns(){const{data,error}=await db.from("festival_campaigns").select("*").order("created_at",{ascending:false}).limit(20);$("campaigns").innerHTML=error?error.message:(data||[]).map(x=>'<p class="row">'+esc(x.title)+' · '+(x.is_active?"Published":"Draft")+'</p>').join("");}
enter();
</script></body></html>
